<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5f4c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MELAYANE">
  <title>MELAYANE</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-melayane-192-final.png">
  <link rel="apple-touch-icon" href="assets/icon-melayane-192-final.png">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #melayaneFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    #melayaneLoading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #ffffff;
      color: #0f5f4c;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #melayaneLoading img {
      width: 112px;
      height: 112px;
      object-fit: contain;
    }

    #melayaneLoading strong {
      font-size: 18px;
    }

    #melayaneLoading small {
      color: #697a74;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="melayaneLoading">
    <img src="assets/icon-melayane-192-final.png" alt="MELAYANE">
    <strong>MELAYANE — A abrir a aplicação...</strong>
    <small>CASA LINO</small>
  </div>

  <iframe
    id="melayaneFrame"
    title="MELAYANE"
    src="https://script.google.com/macros/s/AKfycbwCaTzmWclN21JNmBEcfxx992OgwgmYrRPdGW0JWsEVL8zEXKZu3MpCwZmnHh4x_p2e/exec"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    (function () {
      var frame = document.getElementById("melayaneFrame");
      var loading = document.getElementById("melayaneLoading");

      frame.addEventListener("load", function () {
        loading.classList.add("hidden");
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("service-worker.js")
            .catch(function (erro) {
              console.error("Falha ao registar o Service Worker do MELAYANE.", erro);
            });
        });
      }
    })();
  </script>

</body>
</html>
