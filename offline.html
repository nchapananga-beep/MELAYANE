<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f5f4c">
  <title>MELAYANE — Sem ligação</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #14251f;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .offline-card {
      max-width: 420px;
      text-align: center;
    }

    .offline-card img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .offline-card h1 {
      margin: 0 0 10px;
      color: #0f5f4c;
      font-size: 22px;
    }

    .offline-card p {
      margin: 0;
      line-height: 1.5;
      color: #697a74;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <img src="assets/icon-melayane-192-final.png" alt="MELAYANE">
    <h1>MELAYANE — Sem ligação à Internet</h1>
    <p>Restabeleça a ligação para aceder aos dados da CASA LINO.</p>
  </div>
</body>
</html>
